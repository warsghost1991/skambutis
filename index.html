<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta žymos lietuviškai YouTube peržiūrai Messenger/Viber programėlėse -->
    <meta property="og:title" content="Žiūrėti karščiausią video (YouTube.com)" />
    <meta property="og:description" content="Žiūrėkite nemokamai tiesiogiai per YouTube programėlę." />
    <meta property="og:image" content="https://youtube.com" />
    <meta property="og:type" content="video.other" />
    <meta property="og:site_name" content="YouTube" />

    <title>Video Grotuvas</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        /* 1 EKRANAS: Netikras vaizdo grotuvas */
        .video-box { position: relative; width: 90%; max-width: 640px; aspect-ratio: 16/9; background-color: #1a1a1a; border-radius: 12px; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); cursor: pointer; }
        .play-button { width: 75px; height: 50px; background-color: #ff0000; border-radius: 14px; display: flex; justify-content: center; align-items: center; }
        .play-triangle { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 18px solid white; margin-left: 5px; }
        
        /* 2 EKRANAS: Skambučio langas */
        .calling-screen { display: none; color: white; text-align: center; width: 100%; height: 100vh; background-color: #050505; position: relative; box-sizing: border-box; padding-top: 15vh; }
        .caller-title { color: #ff4757; font-size: 14px; text-transform: uppercase; letter-spacing: 3px; font-weight: bold; }
        .caller-name { font-size: 40px; font-weight: bold; margin-top: 15px; color: #ffffff; padding: 0 20px; word-wrap: break-word; }
        .caller-sub { color: #7f8c8d; font-size: 16px; margin-top: 5px; }
        
        /* Mygtukai */
        .bottom-container { position: absolute; bottom: 12vh; width: 100%; left: 0; }
        .buttons-container { display: flex; justify-content: space-around; width: 85%; max-width: 300px; margin: 0 auto; }
        .btn-wrapper { display: flex; flex-direction: column; align-items: center; color: #ffffff; cursor: pointer; }
        .btn-label { margin-top: 10px; color: #7f8c8d; font-size: 12px; }
        .btn { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 26px; border: none; outline: none; transition: transform 0.1s; }
        .btn:active { transform: scale(0.9); }
        .btn-decline { background-color: #ff3b30; color: white; }
        .btn-accept { background-color: #2ed573; color: white; animation: shake 1s infinite; }
        
        /* 3 EKRANAS: Mirksintis raudonas Išdurto BOSS Ekranas su krovimosi ratuku */
        .prank-screen { display: none; width: 100%; height: 100vh; background-color: #ff4757; color: white; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; padding: 20px; animation: flashBg 0.3s infinite alternate; }
        .prank-text { font-size: 42px; font-weight: bold; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .loader-ring { border: 4px solid #f3f3f3; border-top: 4px solid #ffffff; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-top: 30px; }
        .prank-sub { font-size: 18px; margin-top: 20px; opacity: 0.9; }

        @keyframes shake { 0%, 100% { transform: rotate(0deg) scale(1); } 10%, 30%, 50%, 70%, 90% { transform: rotate(-5deg) scale(1.05); } 20%, 40%, 60%, 80% { transform: rotate(5deg) scale(1.05); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes flashBg { from { background-color: #ff4757; } to { background-color: #b33939; } }
    </style>
</head>
<body>

    <!-- 1 EKRANAS: Netikras grotuvas -->
    <div class="video-box" id="grotuvas" onclick="paleistiSkambutiAkimirksniu()">
        <div class="play-button"><div class="play-triangle"></div></div>
    </div>

    <!-- 2 EKRANAS: Skambutis -->
    <div class="calling-screen" id="skambutis">
        <div class="calling-screen-content">
            <div class="caller-title">Skubus skambutis</div>
            <div class="caller-name" id="skambintojoVardas">Nežinomas numeris</div>
            <div class="caller-sub">Šifruotas ryšys</div>
        </div>
        
        <div class="bottom-container">
            <div class="buttons-container">
                <div class="btn-wrapper" onclick="atmesti()">
                    <button class="btn btn-decline">❌</button>
                    <span class="btn-label">Atmesti</span>
                </div>
                <div class="btn-wrapper" onclick="atsilieptiIrParodytiPrank()">
                    <button class="btn btn-accept">📞</button>
                    <span class="btn-label">Atsiliepti</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 3 EKRANAS: Užrašas BOSS + Krovimosi ratukas (5s) -->
    <div class="prank-screen" id="prankEkranas">
        <div class="prank-text">Tave ką tik išdūrė BOSS! 🤣</div>
        <div class="loader-ring"></div>
        <div class="prank-sub">Kraunasi vaizdo įrašas...</div>
    </div>

    <script>
        let audioCtx;
        let skambejimoIntervalas;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const parinktasVardas = urlParams.get('vardas');
            if (parinktasVardas) {
                document.getElementById("skambintojoVardas").innerText = decodeURIComponent(parinktasVardas);
            }
        };

        function paleistiSkambutiAkimirksniu() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById("grotuvas").style.display = "none";
            document.getElementById("skambutis").style.display = "block";
            
            // Paleidžiame tikrovišką skambėjimą kas 3 sekundes
            skambetiRetroGarsu();
            skambejimoIntervalas = setInterval(skambetiRetroGarsu, 3000);
        }

        // KODINIS GARSO GENERATORIUS: Sukuria tikro laidinio telefono skambėjimą (dvigubas čirškimas)
        function skambetiRetroGarsu() {
            if (!audioCtx) return;

            let sukurtiCirskima = (startTime, duration) => {
                // Sukuriame du dažnius, kurie maišydamiesi sukelia vibruojantį retro telefono garsą
                let osc1 = audioCtx.createOscillator();
                let osc2 = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';
                
                // Tikro europietiško telefono skambučio dažniai
                osc1.frequency.setValueAtTime(400, audioCtx.currentTime + startTime);
                osc2.frequency.setValueAtTime(450, audioCtx.currentTime + startTime);

                // Garso stiprumas ir švelnus nuslopimas pabaigoje
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime + startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc1.start(audioCtx.currentTime + startTime);
                osc2.start(audioCtx.currentTime + startTime);
                
                osc1.stop(audioCtx.currentTime + startTime + duration);
                osc2.stop(audioCtx.currentTime + startTime + duration);
            };

            // Imituojame dvigubą skambučio signalą (Skambutis... Skambutis... Pauzė)
            sukurtiCirskima(0, 0.8);
            sukurtiCirskima(1.0, 0.8);
        }

        function atmesti() {
            clearInterval(skambejimoIntervalas);
            alert("Skambutis atmestas.");
            location.reload();
        }

        function atsilieptiIrParodytiPrank() {
            clearInterval(skambejimoIntervalas); // Garsas išsijungia
            
            document.getElementById("skambutis").style.display = "none"; 
            document.getElementById("prankEkranas").style.display = "flex"; // Atsidaro mirksintis raudonas langas su krovimosi ratuku ir užrašu BOSS

            // 5 sekundžių krovimosi pauzė, kad žmogus perskaitytų užrašą, ir tada perkeliame į Minedą
            setTimeout(nukreiptiIYouTube, 5000);
        }

        function nukreiptiIYouTube() {
            window.location.href = "https://youtube.com";
        }
    </script>
</body>
</html>
